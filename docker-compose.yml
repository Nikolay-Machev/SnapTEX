services:
  web:
    build: .
    environment:
      RECOGNITION_PROVIDER: ${RECOGNITION_PROVIDER:-local}
      SNAPTEX_TRUSTED_PROXIES: ${SNAPTEX_TRUSTED_PROXIES:-}
      SNAPTEX_INTERNAL_TOKEN: ${SNAPTEX_INTERNAL_TOKEN:?Set SNAPTEX_INTERNAL_TOKEN in .env}
      SNAPTEX_JOB_DIRECTORY: /app/jobs
      SNAPTEX_WEB_RATE_LIMIT: ${SNAPTEX_WEB_RATE_LIMIT:-30}
      SNAPTEX_OPENAI_REQUESTS_PER_MINUTE: ${SNAPTEX_OPENAI_REQUESTS_PER_MINUTE:-10}
      SNAPTEX_OPENAI_REQUESTS_PER_DAY: ${SNAPTEX_OPENAI_REQUESTS_PER_DAY:-100}
      SNAPTEX_OPENAI_REQUESTS_PER_CLIENT_DAY: ${SNAPTEX_OPENAI_REQUESTS_PER_CLIENT_DAY:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_RECOGNITION_URL: http://127.0.0.1:8000
    volumes:
      - document-jobs:/app/jobs
    network_mode: "service:recognition"
    depends_on:
      recognition:
        condition: service_healthy
    restart: unless-stopped

  recognition:
    build: ./ml
    environment:
      SNAPTEX_INTERNAL_TOKEN: ${SNAPTEX_INTERNAL_TOKEN:?Set SNAPTEX_INTERNAL_TOKEN in .env}
      SNAPTEX_DEVICE: ${SNAPTEX_DEVICE:-cpu}
      # Use a Hugging Face model ID or a mounted local checkpoint.
      SNAPTEX_MODEL_ID: ${SNAPTEX_MODEL_ID:-tjoab/latex_finetuned}
      SNAPTEX_INFERENCE_PROFILE: ${SNAPTEX_INFERENCE_PROFILE:-legacy}
      HF_TOKEN: ${HF_TOKEN:-}
      SNAPTEX_MAX_CONCURRENCY: ${SNAPTEX_MAX_CONCURRENCY:-2}
      SNAPTEX_QUEUE_TIMEOUT_SECONDS: ${SNAPTEX_QUEUE_TIMEOUT_SECONDS:-2}
      SNAPTEX_INFERENCE_TIMEOUT_SECONDS: ${SNAPTEX_INFERENCE_TIMEOUT_SECONDS:-120}
      SNAPTEX_RATE_LIMIT_REQUESTS: ${SNAPTEX_RATE_LIMIT_REQUESTS:-30}
      SNAPTEX_RATE_LIMIT_WINDOW_SECONDS: ${SNAPTEX_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:3000:3000"
    volumes:
      - huggingface-cache:/models/huggingface
      # Trained weights stay out of Git, but are mounted read-only at runtime.
      - ./ml/checkpoints:/models/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  document-jobs:
  huggingface-cache:
